<body data-root="../">
<main>
  <p class="eyebrow">Interactive challenge</p>
  <h1>Compiler bug hunt</h1>
  <p class="lede">Ten real compiler bugs from weeks 1 to 9, each taken straight from the course's planted-bug suite. Read the failing test, then click the exact line in the compiler that breaks it.</p>

  <div class="bh-nav" aria-label="Bug hunt selector">
    <div class="bh-tabs" role="tablist" aria-label="Bugs 1 to 10" id="bh-tabs"></div>
    <span id="bh-score" class="stat">0 / 10 squashed</span>
    <button type="button" class="btn" id="bh-reset">Reset</button>
  </div>

  <div id="bh-mount"></div>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const { h, store, track } = CC;
  const KEY = 'cc-bughunt';
  const readSolved = () => { try { return new Set(JSON.parse(store.get(KEY) || '[]')); } catch { return new Set(); } };
  const saveSolved = s => store.set(KEY, JSON.stringify([...s]));

  const HUNTS = [
    { id: 'w1-div', week: 'Week 1', title: 'The wrong sign on division',
      lesson: ['week1/02-uir-and-interpreting.html', '1.2 .uir and interpreting'],
      test: '%a = div -7 2\n%t = assert %a -4',
      expect: 'MATCH (-4)',
      got: 'MISMATCH (evaluated to -3)',
      py: { bugs: [4], lines: [
        'def uir_div(a: int, b: int) -> int:',
        '    if b == 0:',
        '        return -1',
        '    q = int(a / b)',
        '    return wrap32(q)',
      ] },
      ml: { bugs: [4], lines: [
        'let uir_div a b =',
        '  if b = 0 then -1',
        '  else',
        '    let q = a / b in',
        '    wrap32 q',
      ] },
      why: 'int(a / b) in Python and / in OCaml both truncate toward zero (-7 / 2 = -3). .uir div floors toward minus infinity (-4), so Python should use a // b and OCaml needs a remainder fix-up when a mod b != 0 and signs differ.' },

    { id: 'w1-muldiv', week: 'Week 1', title: 'The cancellation that breaks on 2^30',
      lesson: ['week1/04-symbolic.html', '1.4 Symbolic simplification'],
      test: '%x   = param [] slot=0 dtype=i32 addrspace=ALU\n%m   = mul %x 2\n%out = div %m 2',
      expect: 'At x = 2^30, result is -2^30 (wraps mod 2^32)',
      got: 'Simplified to %x, returning +2^30',
      py: { bugs: [4, 5], lines: [
        'def rewrite_div(u, x, y):',
        '    if is_const(y, 1): return x',
        '    if is_const(y, 0): return const(-1)',
        '    if x.op == "mul" and x.src[1] is y:',
        '        return x.src[0]',
        '    return u',
      ] },
      ml: { bugs: [4, 5], lines: [
        'let rewrite_div u x y =',
        '  if is_const y 1 then x',
        '  else if is_const y 0 then const (-1)',
        '  else match x.op, x.src with',
        '    | Mul, [a; c] when c == y -> a',
        '    | _ -> u',
      ] },
      why: 'In i32, mul wraps mod 2^32 and div cannot undo a wrap: (2^30 * 2) wraps to INT_MIN, and INT_MIN / 2 is -2^30. Also c must be nonzero (div 0 0 is -1). You may only cancel when y != 0 and bounds prove x cannot wrap.' },

    { id: 'w1-cache', week: 'Week 1', title: 'One function, two calls, same stale answer',
      lesson: ['week1/05-call-and-param.html', '1.5 call and param'],
      test: '%x  = param [] slot=0 dtype=i32 addrspace=ALU\n%b  = add %x 1\n%r1 = call %b 10\n%r2 = call %b 20\n%t  = assert %r2 21',
      expect: 'MATCH (%r2 evaluates to 21)',
      got: 'MISMATCH (%r2 returned 11)',
      py: { bugs: [1], lines: [
        'memo = {}',
        'def eval_node(u, args):',
        '    if u in memo: return memo[u]',
        '    if u.op == "param": v = args[u.arg]',
        '    else: v = run_op(u, [eval_node(s, args) for s in u.src])',
        '    memo[u] = v',
        '    return v',
      ] },
      ml: { bugs: [1], lines: [
        'let memo = Hashtbl.create 64',
        'let rec eval_node u args =',
        '  match Hashtbl.find_opt memo u.id with',
        '  | Some v -> v',
        '  | None ->',
        '    let v = eval_uncached u args in',
        '    Hashtbl.add memo u.id v; v',
      ] },
      why: 'The memo table lives outside the call, so the second call reuses the value cached for args = [10]. Create a fresh memo table at the start of every call.' },

    { id: 'w2-f32zero', week: 'Week 2', title: 'Zero times infinity is not zero',
      lesson: ['week2/01-buffers-and-views.html', '2.1 Floats, buffers and views'],
      test: '%x   = param [] slot=0 dtype=f32 addrspace=ALU\n%out = mul %x 0.0',
      expect: 'At x = inf, result is NaN',
      got: 'Simplified to 0.0',
      py: { bugs: [4, 5], lines: [
        'def rewrite_mul(u, x, y):',
        '    if is_const(y, 1) or is_const(y, 1.0):',
        '        return x',
        '    if is_const(y, 0) or is_const(y, 0.0):',
        '        return y',
        '    return u',
      ] },
      ml: { bugs: [3, 4], lines: [
        'let rewrite_mul u x y =',
        '  if is_const_one y then x',
        '  else if is_const_zero y then',
        '    y',
        '  else u',
      ] },
      why: 'mul(x, 0) -> 0 holds for i32, not f32. In IEEE 754, inf * 0.0 is NaN, NaN * 0.0 is NaN, and -1.0 * 0.0 is -0.0 (different bit pattern from +0.0). Guard the rule to i32 only.' },

    { id: 'w2-overflow', week: 'Week 2', title: 'Crash on float overflow',
      lesson: ['week2/01-buffers-and-views.html', '2.1 Floats, buffers and views'],
      test: '%a = mul 1e20 1e20\n%t = assert %a inf',
      expect: 'MATCH (overflows cleanly to +inf)',
      got: 'Uncaught exception / no outcome line',
      py: { bugs: [2], lines: [
        'def round_f32(x: float) -> float:',
        '    bits = struct.pack("<f", x)',
        '    return struct.unpack("<f", bits)[0]',
      ] },
      ml: { bugs: [2], lines: [
        'let round_f32 (x : float) : float =',
        '  if Float.abs x > 3.4028235e38 then failwith "overflow"',
        '  else Int32.float_of_bits (Int32.bits_of_float x)',
      ] },
      why: 'In Python, struct.pack("<f", 1e40) raises OverflowError instead of returning inf. Catch OverflowError and return math.copysign(math.inf, x). In OCaml, Int32.bits_of_float already overflows to signed infinity.' },

    { id: 'w3-pinned', week: 'Week 3', title: 'The accumulator that forgot to add',
      lesson: ['week3/02-memory-in-loops.html', '3.2 Memory in loops'],
      test: 'Loop runs 4 times, adding 1 to %acc on each iteration.\nWhich line in this .uir program breaks the accumulator?',
      expect: 'Final %acc1 value is 4',
      got: 'Final %acc1 value is 1',
      py: { bugs: [9], lines: [
        '%acc  = alloc 1 dtype=i32',
        '%i    = range 4',
        '%v    = shrink %acc 0 []',
        '%cur  = load %v',
        '%nxt  = add %cur 1',
        '%s    = store %v %nxt',
        '%e    = end %s %i',
        '%acc1 = after %acc %e',
        '%dbg  = add %cur 0   # used in a top-level assert',
      ] },
      ml: { bugs: [9], lines: [
        '%acc  = alloc 1 dtype=i32',
        '%i    = range 4',
        '%v    = shrink %acc 0 []',
        '%cur  = load %v',
        '%nxt  = add %cur 1',
        '%s    = store %v %nxt',
        '%e    = end %s %i',
        '%acc1 = after %acc %e',
        '%dbg  = add %cur 0   # used in a top-level assert',
      ] },
      why: 'A load only moves into a loop when EVERY use of it sits inside that loop. Adding %dbg = add %cur 0 outside the loop pins %cur before the loop, so every iteration adds 1 to the initial 0.' },

    { id: 'w4-negzero', week: 'Week 4', title: 'The lost minus sign on -0.0',
      lesson: ['week4/02-reduce-expand.html', '4.2 Reduce and expand'],
      test: '%b = buffer 1 [-0.0] dtype=f32 slot=0\n%v = load %b\n%r = reduce %v op=add\n%t = assert %r -0.0',
      expect: 'f32 bits 0x80000000 (-0.0)',
      got: 'f32 bits 0x00000000 (+0.0)',
      py: { bugs: [2], lines: [
        'def eval_reduce_add(vals):',
        '    acc = 0.0',
        '    for x in vals:',
        '        acc = round_f32(acc + x)',
        '    return acc',
      ] },
      ml: { bugs: [2, 3], lines: [
        'let eval_reduce_add vals =',
        '  List.fold_left (fun acc x -> round_f32 (acc +. x))',
        '    0.0 vals',
      ] },
      why: 'In IEEE 754, 0.0 + (-0.0) is +0.0. Seeding reduce op=add with 0.0 wipes out -0.0 and also adds an extra rounding step. Always seed from vals[0] and fold vals[1:] left to right.' },

    { id: 'w5-perm', week: 'Week 5', title: 'Permuted backwards on 3D tensors',
      lesson: ['week5/02-reshape-permute.html', '5.2 Reshape and permute'],
      test: 'Input shape: [2 3 4]\nOp: permute order=[2 0 1]',
      expect: 'Output shape [4 2 3]',
      got: 'Output shape [3 4 2]',
      py: { bugs: [4], lines: [
        'def permute_shape(shape, order):',
        '    out = [0] * len(shape)',
        '    for k, p in enumerate(order):',
        '        out[p] = shape[k]',
        '    return out',
      ] },
      ml: { bugs: [4], lines: [
        'let permute_shape shape order =',
        '  let out = Array.make (List.length shape) 0 in',
        '  List.iteri (fun k p ->',
        '    out.(p) <- List.nth shape k) order;',
        '  Array.to_list out',
      ] },
      why: 'Output axis k comes from input axis order[k]: out[k] = shape[order[k]], not out[order[k]] = shape[k]. That bug hides on 2D transposes because [1, 0] is its own inverse, and shows up on 3D cycles like [2, 0, 1].' },

    { id: 'w6-postorder', week: 'Week 6', title: 'Autodiff shares added in reverse order',
      lesson: ['week6/03-autodiff.html', '6.3 Automatic differentiation'],
      test: 'Test: grad_accumulation_order_inner\nShared %x is used on both sides of add; floating-point addition is not associative.',
      expect: 'f32 bits 0x3f800001',
      got: 'f32 bits 0x3f800000',
      py: { bugs: [8], lines: [
        'stack, done, order = [(y, False)], set(), []',
        'while stack:',
        '    u, expanded = stack.pop()',
        '    if u in done: continue',
        '    if expanded: done.add(u); order.append(u)',
        '    else:',
        '        stack.append((u, True))',
        '        stack.extend((s, False) for s in u.src)',
      ] },
      ml: { bugs: [5], lines: [
        'let postorder y =',
        '  let rec visit u =',
        '    if not (Hashtbl.mem seen u.id) then begin',
        '      Hashtbl.add seen u.id ();',
        '      List.iter visit (List.rev u.src);',
        '      out := u :: !out',
        '    end in',
        '  visit y; List.rev !out',
      ] },
      why: 'A LIFO stack pops the last-pushed item first, so pushing u.src forward visits operands right-to-left (reversing post-order). Push reversed(u.src) in Python (or iterate u.src left-to-right in OCaml) so gradient shares arrive in exact spec order.' },

    { id: 'w8-barrier', week: 'Week 8', title: 'The shared-memory race condition',
      lesson: ['week8/03-shared-memory.html', '8.3 Shared memory and barriers'],
      test: 'Test: c_reverse_shared (64 floats reversed through shared memory)\nPhase 1 writes sh[t] = in[t], then phase 2 reads sh[63 - t].',
      expect: 'Exact reversed array on every run',
      got: 'Intermittent zeros and stale values in emulator and GPU',
      py: { bugs: [5, 6, 7], lines: [
        '__shared__ float a0[64];',
        'for (int32_t z = threadIdx.x; z < 64; z += blockDim.x) a0[z] = 0;',
        '__syncthreads();',
        '{ int32_t t = threadIdx.x;',
        '  a0[t] = b0[t]; }',
        '{ int32_t t = threadIdx.x;',
        '  b0[t] = a0[63 - t]; }',
        '__syncthreads();',
      ] },
      ml: { bugs: [5, 6, 7], lines: [
        '__shared__ float a0[64];',
        'for (int32_t z = threadIdx.x; z < 64; z += blockDim.x) a0[z] = 0;',
        '__syncthreads();',
        '{ int32_t t = threadIdx.x;',
        '  a0[t] = b0[t]; }',
        '{ int32_t t = threadIdx.x;',
        '  b0[t] = a0[63 - t]; }',
        '__syncthreads();',
      ] },
      why: 'Warps execute independently. Without __syncthreads() between line 5 and line 6, warp 0 can already read a0[63 - t] before warp 1 has finished writing a0[32..63]. Every local and warp phase must end with __syncthreads().' },
  ];

  const tabsEl = document.getElementById('bh-tabs');
  const scoreEl = document.getElementById('bh-score');
  const mountEl = document.getElementById('bh-mount');
  let solved = readSolved();
  let cur = Math.max(0, HUNTS.findIndex(x => !solved.has(x.id)));
  const hashNum = parseInt(location.hash.slice(1), 10);
  if (hashNum >= 1 && hashNum <= HUNTS.length) cur = hashNum - 1;

  function paintNav() {
    tabsEl.replaceChildren(...HUNTS.map((item, idx) => {
      const done = solved.has(item.id);
      const label = String(idx + 1).padStart(2, '0');
      return h('button', {
        type: 'button', role: 'tab', 'aria-selected': String(idx === cur),
        title: `#${idx + 1}: ${item.title}${done ? ' (squashed)' : ''}`,
        class: 'bh-tab' + (idx === cur ? ' on' : '') + (done ? ' done' : ''),
        text: label,
        onclick: () => { cur = idx; history.replaceState(null, '', '#' + (idx + 1)); render(); },
      });
    }));
    scoreEl.textContent = `${solved.size} / ${HUNTS.length} squashed`;
    scoreEl.className = 'stat' + (solved.size === HUNTS.length ? ' good' : '');
  }

  function render() {
    paintNav();
    const tr = track();
    const item = HUNTS[cur];
    const codeObj = tr === 'ocaml' ? item.ml : item.py;
    const isSolved = solved.has(item.id);

    const stage = h('section', { class: 'bh-stage' + (isSolved ? ' solved' : '') });
    const st = h('span', { class: 'st', text: isSolved ? '✓ Squashed' : 'Click the buggy line' });
    const msg = h('p', { class: 'qmsg', 'aria-live': 'polite' });
    const why = h('div', { class: 'bh-why', hidden: isSolved ? null : '' },
      h('p', {}, h('strong', { text: 'Why it fails: ' }), item.why),
      h('p', {}, 'Review this rule in ', h('a', { href: '../' + item.lesson[0], text: item.lesson[1] }), '.'));

    const nextBtn = h('button', {
      type: 'button',
      class: 'btn' + (isSolved && cur < HUNTS.length - 1 ? ' primary' : ''),
      disabled: cur >= HUNTS.length - 1 ? '' : null,
      text: cur >= HUNTS.length - 1 ? 'Last bug' : 'Next bug →',
      onclick: () => { if (cur < HUNTS.length - 1) { cur++; history.replaceState(null, '', '#' + (cur + 1)); render(); } },
    });
    const prevBtn = h('button', {
      type: 'button', class: 'btn',
      disabled: cur <= 0 ? '' : null,
      text: '← Previous',
      onclick: () => { if (cur > 0) { cur--; history.replaceState(null, '', '#' + (cur + 1)); render(); } },
    });

    const codeBox = h('div', { class: 'bh-code' });
    const buttons = codeObj.lines.map((line, li) => {
      const lineNum = li + 1;
      const isHit = codeObj.bugs.includes(lineNum);
      const btn = h('button', {
        type: 'button',
        class: 'bh-line' + (isSolved && isHit ? ' right' : ''),
        disabled: isSolved ? '' : null,
      },
        h('span', { class: 'ln', text: String(lineNum) }),
        h('span', { text: line }));
      btn.onclick = () => {
        if (solved.has(item.id)) return;
        if (isHit) {
          solved.add(item.id); saveSolved(solved); paintNav();
          stage.classList.add('solved'); st.textContent = '✓ Squashed';
          btn.classList.add('right');
          buttons.forEach(b => (b.disabled = true));
          msg.textContent = `Found it on line ${lineNum}.`; msg.className = 'qmsg';
          why.hidden = false;
          if (cur < HUNTS.length - 1) nextBtn.classList.add('primary');
        } else {
          btn.classList.add('wrong'); btn.disabled = true;
          msg.textContent = `Line ${lineNum} is fine. Look closely at what produces the failing result above.`;
          msg.className = 'qmsg no';
        }
      };
      return btn;
    });
    codeBox.append(...buttons);

    const brief = h('div', { class: 'bh-brief' },
      h('span', { class: 'label', text: 'Failing test' }),
      h('pre', {}, h('code', { text: item.test })),
      h('div', { class: 'bh-diff' },
        h('span', { class: 'exp' }, 'Expected: ', item.expect),
        h('span', { class: 'got' }, 'Got: ', item.got)));

    const work = h('div', { class: 'bh-work' },
      h('span', { class: 'label', text: 'Click the line with the bug' }),
      codeBox, msg, why);

    const foot = h('div', { class: 'bh-foot' },
      prevBtn,
      h('span', { class: 'muted', text: `Bug ${cur + 1} of ${HUNTS.length} · ${tr === 'ocaml' ? 'OCaml' : 'Python'} track` }),
      nextBtn);

    stage.append(
      h('div', { class: 'bh-head' }, h('span', { class: 'n', text: `#${cur + 1} · ${item.week}` }), h('h2', { text: item.title }), st),
      brief, work, foot);

    mountEl.replaceChildren(stage);
  }

  document.getElementById('bh-reset').onclick = () => { solved = new Set(); saveSolved(solved); cur = 0; history.replaceState(null, '', '#1'); render(); };
  document.addEventListener('cc-progress', render);
  render();
});
</script>
</body>
</html>
